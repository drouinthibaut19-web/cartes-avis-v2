<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirection en cours...</title>
</head>
<body>
    <p>Recherche du commerce...</p>

    <script>
        const urlBaseDeDonnees = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSczZlwA3mitoh7y8tdLsuv6yCdUXaWBThs0OALXv5GIuLJM2n2vNOMRNplJipkC-GOuDp9FhdHsiWA/pub?output=tsv";

        const urlParams = new URLSearchParams(window.location.search);
        const carteId = urlParams.get('c');

        if (carteId) {
            fetch(urlBaseDeDonnees)
                .then(response => response.text())
                .then(texte => {
                    const lignes = texte.split('\n');
                    let lienTrouve = "";

                    for (let i = 1; i < lignes.length; i++) {
                        const colonnes = lignes[i].split('\t');
                        const idLigne = colonnes[0] ? colonnes[0].trim() : "";
                        
                        if (idLigne === carteId) {
                            // Lit la 5e colonne (index 4) : N° carte (0), Commerce (1), Ville (2), Place ID (3), Lien final (4)
                            lienTrouve = colonnes[4] ? colonnes[4].trim() : "";
                            break;
                        }
                    }

                    if (lienTrouve && lienTrouve.startsWith("http")) {
                        window.location.replace(lienTrouve);
                    } else {
                        document.body.innerHTML = "<h1>Cette carte n'est pas encore configurée.</h1>";
                    }
                })
                .catch(erreur => {
                    document.body.innerHTML = "<h1>Erreur de connexion à la base de données.</h1>";
                });
        } else {
            document.body.innerHTML = "<h1>Erreur : Aucune carte scannée.</h1>";
        }
    </script>
</body>
</html>
